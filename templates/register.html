<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | AlumniConnect</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .register-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background: #f7f7ff;
        }

        .register-card {
            width: 100%;
            max-width: 620px;
            background: white;
            padding: 45px;
            border-radius: 24px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.08);
        }

        .register-card h1 {
            margin-bottom: 8px;
            color: #182238;
            font-size: 34px;
        }

        .register-card > p {
            color: #697386;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            color: #182238;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #dfe3eb;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #5b32d6;
        }

        .role-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .role-option {
            border: 1px solid #dfe3eb;
            border-radius: 12px;
            padding: 15px;
        }

        .role-option input {
            width: auto;
            margin-right: 8px;
        }

        .role-option label {
            display: inline;
            cursor: pointer;
        }

        .register-btn {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 11px;
            background: #5b32d6;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
        }

        .register-btn:hover {
            background: #4824b5;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            color: #697386;
        }

        .login-link a {
            color: #5b32d6;
            font-weight: 700;
            text-decoration: none;
        }

        .flash-message {
            background: #ffe8e8;
            color: #c62828;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .back-home {
            display: inline-block;
            margin-bottom: 25px;
            color: #5b32d6;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .register-card {
                padding: 30px 22px;
            }

            .role-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="register-page">

    <div class="register-card">

        <a href="/" class="back-home">← Back to Home</a>

        <h1>Create your account</h1>

        <p>Join AlumniConnect and start building meaningful career connections.</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash-message">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <div class="form-group">
                <label>Full Name</label>
                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="form-group">
                <label>Username</label>
                <input
                    type="text"
                    name="username"
                    placeholder="Choose a unique username"
                    required
                >
            </div>

            <div class="form-group">
                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label>Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >
            </div>

            <div class="form-group">

                <label>I am a</label>

                <div class="role-options">

                    <div class="role-option">
                        <input
                            type="radio"
                            id="student"
                            name="role"
                            value="student"
                            required
                        >
                        <label for="student">🎓 Student</label>
                    </div>

                    <div class="role-option">
                        <input
                            type="radio"
                            id="alumni"
                            name="role"
                            value="alumni"
                        >
                        <label for="alumni">💼 Alumni</label>
                    </div>

                </div>

            </div>

            <div class="form-group">
                <label>Course / Degree</label>
                <input
                    type="text"
                    name="course"
                    placeholder="Example: B.Tech CSE"
                >
            </div>

            <div class="form-group" id="company-group" style="display: none;">
                <label>Company</label>
                <input
                    type="text"
                    name="company"
                    id="company"
                    placeholder="Example: Google"
                >
            </div>

            <div class="form-group">
                <label>Skills</label>
                <input
                    type="text"
                    name="skills"
                    placeholder="Example: Python, AI/ML, SQL"
                >
            </div>

            <button type="submit" class="register-btn">
                Create Account
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="/login">Login here</a>
        </div>

    </div>

</div>

<script>
    const studentRadio = document.getElementById("student");
    const alumniRadio = document.getElementById("alumni");
    const companyGroup = document.getElementById("company-group");
    const companyInput = document.getElementById("company");

    function updateRoleFields() {
        if (alumniRadio.checked) {
            companyGroup.style.display = "block";
        } else {
            companyGroup.style.display = "none";
            companyInput.value = "";
        }
    }

    studentRadio.addEventListener("change", updateRoleFields);
    alumniRadio.addEventListener("change", updateRoleFields);

    updateRoleFields();
</script>

</body>
</html>
