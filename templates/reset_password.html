<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | AlumniConnect</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .reset-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background: #f7f7ff;
        }

        .reset-card {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 45px;
            border-radius: 24px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.08);
        }

        .brand {
            font-size: 24px;
            font-weight: 800;
            color: #182238;
            margin-bottom: 30px;
        }

        .brand span {
            color: #5b32d6;
        }

        .reset-card h1 {
            font-size: 32px;
            color: #182238;
            margin-bottom: 10px;
        }

        .reset-card > p {
            color: #697386;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #182238;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #dfe3eb;
            border-radius: 10px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }

        .form-group input:focus {
            border-color: #5b32d6;
        }

        .reset-btn {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 11px;
            background: #5b32d6;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .reset-btn:hover {
            background: #4824b5;
        }

        .error-message {
            background: #ffe8e8;
            color: #c62828;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .login-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #5b32d6;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="reset-page">

    <div class="reset-card">

        <div class="brand">
            Alumni<span>Connect</span>
        </div>

        <h1>Create New Password</h1>

        <p>
            Choose a new password for your AlumniConnect account.
        </p>

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}

        {% if not error %}

        <form method="POST">

            <div class="form-group">
                <label>New Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter new password"
                    minlength="6"
                    required
                >
            </div>

            <div class="form-group">
                <label>Confirm New Password</label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    minlength="6"
                    required
                >
            </div>

            <button type="submit" class="reset-btn">
                Reset Password
            </button>

        </form>

        {% endif %}

        <a href="/login" class="login-link">
            ← Back to Login
        </a>

    </div>

</div>

</body>
</html>
