<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat | AlumniConnect</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body {
            margin: 0;
            background: #f7f7ff;
            font-family: Arial, sans-serif;
        }

        .chat-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 950px;
            height: 85vh;
            background: white;
            border-radius: 24px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #5b32d6;
            color: white;
            padding: 22px 28px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: white;
            color: #5b32d6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 20px;
        }

        .chat-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .chat-header p {
            margin: 4px 0 0;
            opacity: 0.85;
            font-size: 14px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message-row {
            display: flex;
        }

        .message-row.sent {
            justify-content: flex-end;
        }

        .message-row.received {
            justify-content: flex-start;
        }

        .message {
            max-width: 65%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.5;
        }

        .sent .message {
            background: #5b32d6;
            color: white;
            border-bottom-right-radius: 5px;
        }

        .received .message {
            background: #f0f0f5;
            color: #182238;
            border-bottom-left-radius: 5px;
        }

        .message-time {
            display: block;
            margin-top: 5px;
            font-size: 11px;
            opacity: 0.7;
        }

        .chat-form {
            display: flex;
            gap: 12px;
            padding: 18px;
            border-top: 1px solid #e5e7ef;
            background: white;
        }

        .chat-form input {
            flex: 1;
            padding: 14px 16px;
            border: 1px solid #dfe3eb;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
        }

        .chat-form input:focus {
            border-color: #5b32d6;
        }

        .chat-form button {
            border: none;
            background: #5b32d6;
            color: white;
            padding: 0 25px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .chat-form button:hover {
            background: #4824b5;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 25px;
            color: #5b32d6;
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 700px) {
            .chat-page {
                padding: 15px;
            }

            .chat-container {
                height: 90vh;
            }

            .message {
                max-width: 80%;
            }

            .back-link {
                display: none;
            }
        }
    </style>
</head>

<body>

<a href="javascript:history.back()" class="back-link">
    ← Back
</a>

<div class="chat-page">

    <div class="chat-container">

        <div class="chat-header">

            <div class="avatar">
                {{ other_user["name"][0] | upper }}
            </div>

            <div>
                <h2>{{ other_user["name"] }}</h2>

                <p>
                    {% if other_user["role"] == "alumni" %}
                        {{ other_user["company"] }}
                    {% else %}
                        Student
                    {% endif %}
                </p>
            </div>

        </div>

        <div class="messages" id="messages">

            {% for message in messages %}

            <div class="message-row {% if message['sender_id'] == current_user_id %}sent{% else %}received{% endif %}">

                <div class="message">

                    {{ message["message"] }}

                    <span
                        class="message-time"
                        data-time="{{ message['created_at'] }}"
                    >
                    </span>

                </div>

            </div>

            {% endfor %}

        </div>

        <form method="POST" class="chat-form">

            <input
                type="text"
                name="message"
                placeholder="Type your message..."
                autocomplete="off"
                required
            >

            <button type="submit">
                Send
            </button>

        </form>

    </div>

</div>

<script>
    document.querySelectorAll(".message-time").forEach(function(element) {
        const utcTime = element.getAttribute("data-time").replace(" ", "T") + "Z";
        const date = new Date(utcTime);

        element.textContent = date.toLocaleString("en-IN", {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            hour12: true
        });
    });

    const messages = document.getElementById("messages");

    if (messages) {
        messages.scrollTop = messages.scrollHeight;
    }
</script>

</body>
</html>
