<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | AlumniConnect</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .feature-page {
            min-height: 100vh;
            padding: 60px 8%;
            background: #f7f7ff;
        }

        .feature-container {
            max-width: 1000px;
            margin: auto;
        }

        .back-link {
            color: #5b32d6;
            text-decoration: none;
            font-weight: 700;
        }

        .feature-header {
            margin-top: 35px;
            margin-bottom: 30px;
        }

        .feature-header h1 {
            font-size: 42px;
            color: #182238;
            margin-bottom: 10px;
        }

        .feature-header p {
            color: #697386;
            font-size: 18px;
        }

        .feature-card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.06);
        }

        .feature-card h2 {
            color: #182238;
            margin-bottom: 12px;
        }

        .feature-card p {
            color: #697386;
            line-height: 1.7;
        }

        .primary-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 22px;
            border-radius: 10px;
            background: #5b32d6;
            color: white;
            text-decoration: none;
            font-weight: 700;
        }

        .primary-btn:hover {
            background: #4824b5;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .stat {
            background: #f2efff;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
        }

        .stat h3 {
            font-size: 28px;
            color: #5b32d6;
            margin: 0 0 8px;
        }

        .stat p {
            margin: 0;
            color: #697386;
        }

        @media (max-width: 700px) {
            .feature-page {
                padding: 40px 20px;
            }

            .feature-header h1 {
                font-size: 32px;
            }

            .stat-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="feature-page">

    <div class="feature-container">

        <a href="{{ dashboard_url }}" class="back-link">
            ← Back to Dashboard
        </a>

        <div class="feature-header">
            <h1>{{ icon }} {{ title }}</h1>
            <p>{{ description }}</p>
        </div>

        <div class="feature-card">

            <h2>{{ heading }}</h2>

            <p>{{ content }}</p>

            {% if stats %}
            <div class="stat-grid">

                {% for stat in stats %}
                <div class="stat">
                    <h3>{{ stat.value }}</h3>
                    <p>{{ stat.label }}</p>
                </div>
                {% endfor %}

            </div>
            {% endif %}

            {% if action_url %}
            <a href="{{ action_url }}" class="primary-btn">
                {{ action_text }}
            </a>
            {% endif %}

        </div>

    </div>

</div>

</body>
</html>
